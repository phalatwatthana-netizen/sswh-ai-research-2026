<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSWH AI Research 2026</title>
  <style>
    :root {
      --bg: #0f172a;
      --fg: #e2e8f0;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    main {
      text-align: center;
      padding: 2rem;
      max-width: 640px;
    }
    h1 {
      font-size: clamp(1.8rem, 5vw, 3rem);
      margin-bottom: 0.5rem;
    }
    p { line-height: 1.6; opacity: 0.85; }
    .accent { color: var(--accent); }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.4rem 0.9rem;
      border: 1px solid var(--accent);
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>SSWH <span class="accent">AI Research</span> 2026</h1>
    <p>เว็บไซต์เริ่มต้นสำหรับเชื่อมต่อ GitHub กับ Netlify เรียบร้อยแล้ว</p>
    <p>Starter site deployed via GitHub &amp; Netlify.</p>
    <span class="badge">Deployed with Netlify</span>
  </main>
</body>
</html>
